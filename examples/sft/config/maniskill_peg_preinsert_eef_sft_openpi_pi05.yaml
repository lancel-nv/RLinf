defaults:
- model/pi0_5@actor.model
- hybrid_engines/openpi_fsdp@actor.fsdp_config
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: maniskill_peg_preinsert_eef_sft_openpi_pi05
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 250
data:
  train_data_paths:
  - dataset_path: /path/to/preinsert/dataset
    weight: 1.0
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 256
  seed: 0
  model:
    precision: fp32
    model_path: /path/to/pi05_base_openpi
    model_type: openpi
    num_action_chunks: 10
    action_dim: 10
    add_value_head: false
    num_steps: 5
    prefix:
      pool: masked_mean
      image_only: false
    openpi:
      embed_dtype: bf16
      task: sft
      config_name: pi05_maniskill_eef_rot6d
      num_images_in_input: 2
      train_expert_only: false
      detach_critic_input: true
      action_horizon: 10
      action_chunk: 10
      action_env_dim: 10
      num_steps: 5
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      discrete_state_input: true
      use_rlt: false
    openpi_data:
      repo_id: /path/to/preinsert/dataset
      default_prompt: insert the peg in the hole
      norm_stats_path: /path/to/preinsert/dataset/norm_stats.json
  optim:
    lr: 2.5e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 3000
    lr_warmup_steps: 1000
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 2.5e-06
  fsdp_config:
    strategy: fsdp
    sharding_strategy: shard_grad_op
    use_orig_params: true
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
reward:
  use_reward_model: false
critic:
  use_critic_model: false
