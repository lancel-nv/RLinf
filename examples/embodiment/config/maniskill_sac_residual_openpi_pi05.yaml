defaults:
  - env/maniskill_rlt@env.train
  - env/maniskill_rlt@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 0-0
    rollout: 0-0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: maniskill_sac_residual_openpi_pi05
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10
  save_interval: 10
  resume_dir: null
  ckpt_path: null
  weight_sync_interval: 1

algorithm:
  adv_type: embodied_sac
  loss_type: sac_residual
  loss_agg_func: token-mean
  group_size: 1
  gamma: 0.99  # Per executed chunk, matching the reference replay decisions.
  tau: 0.005
  bootstrap_type: standard
  backup_entropy: False
  critic_actor_ratio: 20
  target_update_freq: 1
  target_update_type: all
  residual_schedule:
    utd: 20
    warmup_transitions: 1024
    warmup_updates: 2000
    max_updates_per_iteration: 10000
  entropy_tuning:
    alpha_type: exp
    initial_alpha: 0.0002
    # Derived from executed dimensions and edit scales; not the old 90-D target.
    target_entropy: null
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 1.0
  replay_buffer:
    enable_cache: True
    cache_size: 50000
    sample_window_size: 50000
    min_buffer_size: 1024
    enable_preload: False
    auto_save: False

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: False
    ignore_terminations: False
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    rlt_policy_switch:
      enable: False
  eval:
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: False
    ignore_terminations: False
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    rlt_policy_switch:
      enable: False

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  pipeline_stage_num: 1
  enable_offload: False
  collect_transitions: True
  collect_prev_infos: False
  collect_final_values: True  # Also requests final-state feature inference.
  enable_torch_compile: False
  enable_cuda_graph: False
  model:
    model_path: ""
    precision: fp32
  residual_base_model:
    model_type: openpi
    # Use the actor directory from the existing ManiSkill Stage1/SFT run.
    model_path: /path/to/maniskill_rlt_stage1_sft_openpi_pi05/checkpoints/global_step_3000/actor
    precision: bf16
    num_action_chunks: 10
    action_dim: 8
    num_steps: 5
    add_value_head: False
    is_lora: False
    openpi_data:
      repo_id: maniskill_peginsertionside_joint
      # Reuse the same dataset statistics as Stage1/SFT.
      norm_stats_path: /path/to/maniskill_peginsertionside_joint/norm_stats.json
      default_prompt: insert the peg in the hole
    openpi:
      task: eval
      config_name: pi05_rlt_maniskill_joint
      num_images_in_input: 2
      action_chunk: 10
      action_horizon: 10
      action_env_dim: 8
      model_action_dim: 32
      num_steps: 5
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      discrete_state_input: True
      use_rlt: False

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False
  model:
    model_type: sac_residual
    model_path: ""
    precision: fp32
    policy_setup: panda-qpos
    state_dim: 9
    visual_dim: 2048
    state_proj_dim: 128
    visual_proj_dim: 256
    action_dim: 8
    num_action_chunks: 10
    hidden_size: 256
    depth: 3
    num_q_heads: 10
    edit_scale: 0.2
    initial_log_std: -1.5
    action_clipping: none
    add_value_head: False
    add_q_head: True
    is_lora: False
  optim:
    lr: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    clip_grad: 1.0
    lr_scheduler: torch_constant
  critic_optim:
    lr: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    clip_grad: 1.0
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: True
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
