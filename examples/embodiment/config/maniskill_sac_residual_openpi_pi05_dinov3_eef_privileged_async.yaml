defaults:
- env/maniskill_rlt@env.train
- env/maniskill_rlt@env.eval
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 1-1
    rollout: 1-1
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: maniskill_sac_residual_openpi_pi05_dinov3_eef_privileged_async
    logger_backends:
    - tensorboard
  max_critic_updates: 800000
  max_epochs: 2000
  max_steps: -1
  only_eval: false
  val_check_interval: 10
  save_interval: 10
  resume_dir: null
  ckpt_path: null
  weight_sync_interval: 1
algorithm:
  adv_type: embodied_sac
  loss_type: sac_residual
  loss_agg_func: token-mean
  group_size: 1
  gamma: 0.99
  tau: 0.005
  bootstrap_type: standard
  bootstrap_time_limits: true
  backup_entropy: false
  critic_actor_ratio: 20
  target_update_freq: 1
  target_update_type: all
  residual_schedule:
    utd: 20
    warmup_transitions: 4000
    warmup_updates: 20000
    critic_warmup_updates: 20000
    max_updates_per_iteration: 400
  entropy_tuning:
    alpha_type: exp
    initial_alpha: 1e-5
    target_entropy: null
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 1.0
  replay_buffer:
    enable_cache: true
    cache_size: 50000
    sample_window_size: 50000
    min_buffer_size: 4000
    enable_preload: false
    auto_save: false
env:
  group_name: EnvGroup
  train:
    critic_privileged_obs: true
    reward_mode: peg_staged_dense
    use_rel_reward: false
    peg_dense_reward:
      grasp_min_peg_m: [-0.07526223540306091, -0.0051492496114224195, -0.006075498387217521]
      grasp_max_peg_m: [-0.04971568666398525, 0.005041133537888527, 0.0059984102100133895]
      reach_scale_m: 0.05
      alignment_tolerance_m: 0.002
      alignment_scale_m: 0.05
      axis_tolerance_deg: 5.0
      depth_scale_m: 0.10
    init_params:
      id: PegInsertionSideHardClearance-v1
      control_mode: pd_ee_delta_pose
      sim_backend: gpu
      reconfiguration_freq: 1
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    rlt_policy_switch:
      enable: false
    wrap_obs_mode: openpi_eef_rot6d
  eval:
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    critic_privileged_obs: true
    reward_mode: peg_staged_dense
    use_rel_reward: false
    peg_dense_reward:
      grasp_min_peg_m: [-0.07526223540306091, -0.0051492496114224195, -0.006075498387217521]
      grasp_max_peg_m: [-0.04971568666398525, 0.005041133537888527, 0.0059984102100133895]
      reach_scale_m: 0.05
      alignment_tolerance_m: 0.002
      alignment_scale_m: 0.05
      axis_tolerance_deg: 5.0
      depth_scale_m: 0.10
    init_params:
      id: PegInsertionSideHardClearance-v1
      control_mode: pd_ee_delta_pose
      sim_backend: gpu
      reconfiguration_freq: 1
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    rlt_policy_switch:
      enable: false
    wrap_obs_mode: openpi_eef_rot6d
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  pipeline_stage_num: 1
  enable_offload: false
  collect_transitions: true
  collect_prev_infos: false
  collect_final_values: true
  enable_torch_compile: false
  enable_cuda_graph: false
  model:
    model_path: ''
    precision: fp32
  residual_dinov3:
    repo_path: /path/to/dinov3
    weights_path: /path/to/dinov3_vits16_pretrain.pth
    weights_sha256: null
    camera_keys:
    - main_images
    - wrist_images
    image_height: 224
    image_width: 320
    spatial_pool_height: 2
    spatial_pool_width: 2
  residual_base_model:
    model_type: openpi
    model_path: /path/to/maniskill_pi05_10mm_eef_rot6d_sft/checkpoints/global_step_1000/actor
    precision: bf16
    num_action_chunks: 10
    action_dim: 10
    num_steps: 5
    add_value_head: false
    is_lora: false
    openpi_data:
      repo_id: maniskill_peginsertionside_10mm_eef_rot6d
      norm_stats_path: /path/to/maniskill_peginsertionside_10mm_eef_rot6d/norm_stats.json
      default_prompt: insert the peg in the hole
    openpi:
      task: eval
      config_name: pi05_maniskill_eef_rot6d
      num_images_in_input: 2
      action_chunk: 10
      action_horizon: 10
      action_env_dim: 10
      model_action_dim: 32
      num_steps: 5
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      discrete_state_input: true
      use_rlt: false
actor:
  group_name: ActorGroup
  training_backend: fsdp
  sync_weight_no_wait: true
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  model:
    model_type: sac_residual
    model_path: ''
    precision: fp32
    policy_setup: panda-eef-rot6d
    actor_use_privileged_state: true
    privileged_state_dim: 31
    privileged_proj_dim: 128
    state_dim: 10
    visual_dim: 3072
    state_proj_dim: 128
    visual_proj_dim: 256
    action_dim: 10
    num_action_chunks: 10
    hidden_size: 256
    depth: 3
    num_q_heads: 10
    edit_scale: 0.02
    initial_log_std: -1.5
    action_clipping: none
    add_value_head: false
    add_q_head: true
    is_lora: false
    eef_rot6d_norm_stats_path: /path/to/maniskill_peginsertionside_10mm_eef_rot6d/norm_stats.json
  optim:
    lr: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 1.0
    lr_scheduler: torch_constant
  critic_optim:
    lr: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 1.0
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
reward:
  use_reward_model: false
critic:
  use_critic_model: false
